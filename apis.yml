name: Brit + Co
description: Brit + Co is a lifestyle and entertainment media platform founded by Brit Morin that publishes
  content and creative education for a primarily women audience. It covers self-care, food, home and DIY,
  travel, relationships, celebrity and entertainment news, horoscopes, shopping guides, and games, and
  operates a learning platform (learn.brit.co) offering more than one hundred creative online classes.
  The company was surfaced as a portfolio company of Slow Ventures. It is a consumer media and e-learning
  brand and does not currently publish a public developer API, developer portal, or machine-readable API
  artifacts; this profile captures its public web identity and domain-security posture.
